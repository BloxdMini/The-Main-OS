<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <title>NEXUS OS — Desktop Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --glass: rgba(18, 23, 32, .90);
      --glass-solid: #171c25;
      --border: rgba(231, 237, 245, .12);
      --text: #edf0f5;
      --muted: #a2aab7;
      --accent: #8ba5c9;
      --blue: #8ba5c9;
      --shadow: 0 24px 72px rgba(0, 0, 0, .48);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    .icon-library { position:absolute; width:0; height:0; overflow:hidden; }
    .inline-icon { width:14px; height:14px; vertical-align:-3px; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--text); background: #10151f; user-select: none; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .desktop {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 73% 34%, rgba(60, 88, 113, .29), transparent 40%),
        radial-gradient(ellipse at 29% 75%, rgba(54, 69, 91, .26), transparent 43%),
        linear-gradient(136deg, #141a23 0%, #202a37 48%, #111720 100%);
      transition: filter .25s;
    }
    .desktop::before, .desktop::after {
      position: absolute; content: ""; pointer-events: none; border-radius: 50%;
      filter: blur(1px); transform: rotate(-28deg);
    }
    .desktop::before {
      width: 90vw; height: 38vw; left: 29vw; top: 30vh;
      border: 1px solid rgba(203, 218, 235, .08);
      box-shadow: 0 0 120px rgba(78, 109, 137, .08), inset 0 0 110px rgba(80, 106, 132, .06);
    }
    .desktop::after {
      width: 59vw; height: 25vw; left: 48vw; top: 37vh;
      border: 1px solid rgba(203, 218, 235, .07);
      box-shadow: 0 0 80px rgba(102, 130, 158, .07);
    }
    .topbar {
      position: absolute; z-index: 5; inset: 0 0 auto; height: 40px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 17px; background: rgba(14, 18, 25, .78);
      border-bottom: 1px solid rgba(255,255,255,.055); backdrop-filter: blur(22px);
      font-size: 12px;
    }
    .top-left, .top-right { display: flex; align-items: center; gap: 17px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .09em; }
    .brand-mark { color: #aebbc9; display:flex; }
    .brand-mark svg { width:17px; height:17px; }
    .top-item, .tray-item { color: #e7edf7; opacity: .88; }
    .top-item { cursor: pointer; }
    .top-item:hover { color: var(--accent); }
    .tray { display:flex; align-items:center; gap:12px; }
    .tray svg, .task-right svg { width: 16px; height: 16px; display:block; }
    #clock { min-width: 86px; text-align: right; font-variant-numeric: tabular-nums; }
    .desktop-icons {
      position: absolute; z-index: 1; top: 58px; left: 13px;
      display: grid; grid-auto-flow: column; grid-template-rows: repeat(5, 88px);
      gap: 5px 8px;
    }
    .desktop-icon {
      width: 78px; border: 0; background: transparent; border-radius: 6px;
      display: flex; flex-direction: column; align-items:center; justify-content:center;
      gap: 6px; cursor: pointer; text-shadow: 0 1px 3px #000a;
    }
    .desktop-icon:hover, .desktop-icon:focus-visible { background: rgba(224,233,243,.11); outline: 1px solid rgba(255,255,255,.10); }
    .desktop-icon .glyph { width:29px; height:29px; padding:5px; color:#d4dce5; border-radius:6px; background:linear-gradient(145deg,#59697d,#354151); filter:drop-shadow(0 2px 4px #0005); }
    .desktop-icon[data-app="files"] .glyph { color:#d9c596; background:linear-gradient(145deg,#6f6855,#494436); }
    .desktop-icon[data-app="terminal"] .glyph { color:#c1cfce; background:linear-gradient(145deg,#52636a,#303d43); }
    .desktop-icon[data-app="settings"] .glyph { color:#d2d8e1; background:linear-gradient(145deg,#647184,#414a59); }
    .desktop-icon span:last-child { font-size: 11px; }
    .welcome {
      position:absolute; z-index:1; right:28px; bottom:76px;
      text-align:right; width:min(350px, 65vw); pointer-events:none;
    }
    .welcome h1 { font-weight:500; letter-spacing:.17em; font-size:19px; margin:0; color:#d5dce5; }
    .welcome p { color:rgba(224,232,241,.58); font-size:11px; letter-spacing:.025em; margin:7px 0 0; }
    .window {
      position: absolute; z-index: 3; top: 15%; left: 26%; width: min(720px, 76vw);
      height: min(500px, 65vh); min-width: 320px; min-height: 230px;
      display:flex; flex-direction:column; overflow:hidden;
      background: rgba(27, 32, 41, .97); border:1px solid rgba(255,255,255,.13);
      border-radius:9px; box-shadow:var(--shadow); backdrop-filter:blur(24px);
    }
    .window.hidden { display:none; }
    .window.maximized { inset:49px 10px 60px !important; width:auto !important; height:auto !important; }
    .titlebar {
      height:42px; flex:0 0 42px; display:flex; align-items:center; justify-content:space-between;
      padding:0 12px 0 16px; background:rgba(255,255,255,.025); border-bottom:1px solid var(--border);
      cursor:move;
    }
    .window-title { display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; }
    .window-title svg { width:17px; height:17px; color:#c2ccd8; }
    .window-controls { display:flex; gap:4px; }
    .window-controls button {
      width:28px; height:25px; border:0; border-radius:4px; background:transparent;
      color:#c9d3e2; cursor:pointer;
    }
    .window-controls button:hover { background:rgba(255,255,255,.13); }
    .window-controls .close:hover { background:#d94f62; color:white; }
    .window-content { flex:1; overflow:auto; padding:18px; user-select:text; }
    .toolbar { display:flex; align-items:center; gap:9px; margin-bottom:16px; }
    .toolbutton, .primary {
      border:1px solid var(--border); border-radius:7px; background:rgba(255,255,255,.07);
      padding:8px 12px; cursor:pointer;
    }
    .toolbutton:hover { background:rgba(255,255,255,.13); }
    .primary { background:#1d887f; border-color:#35b9a6; color:white; }
    .primary:hover { background:#23a091; }
    .address { flex:1; background:rgba(0,0,0,.2); padding:8px 11px; border-radius:6px; color:#cbd8e8; font-size:12px; }
    .file-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:10px; }
    .file {
      min-height:90px; border:1px solid transparent; border-radius:8px; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
      background:rgba(255,255,255,.025); font-size:12px; color:#e1e8f2;
    }
    .file:hover { border-color:var(--border); background:rgba(255,255,255,.07); }
    .file svg { width:25px; height:25px; color:#b8c4d1; }
    .file span:first-child { display:flex; }
    .store-intro { color:var(--muted); font-size:13px; line-height:1.55; margin:0 0 18px; }
    .store-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
    .store-card {
      min-height:170px; display:flex; flex-direction:column; align-items:flex-start;
      padding:17px; border:1px solid var(--border); border-radius:10px;
      background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));
    }
    .store-symbol {
      width:38px; height:38px; display:grid; place-items:center; border-radius:9px;
      background:rgba(139,165,201,.16); color:#c5d5e7; font-size:12px; font-weight:700;
      letter-spacing:.04em; margin-bottom:12px;
    }
    .store-symbol svg { width:20px; height:20px; }
    .store-card h3 { margin:0; font-size:14px; font-weight:600; }
    .store-card p { flex:1; margin:6px 0 14px; color:var(--muted); font-size:12px; line-height:1.45; }
    .store-link { color:#b6cce4; font-size:12px; text-decoration:none; }
    .store-link:hover { color:#fff; text-decoration:underline; }
    .package-list { display:grid; gap:8px; margin:16px 0; }
    .package-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 13px; border:1px solid var(--border); border-radius:7px; background:rgba(255,255,255,.025); }
    .package-row strong { font-size:12px; font-weight:600; }
    .package-row small { display:block; margin-top:3px; color:var(--muted); font-size:11px; }
    .package-status { color:#9bc9aa; font-size:11px; white-space:nowrap; }
    .install-command { display:flex; gap:8px; align-items:center; margin-top:14px; }
    .install-command input { flex:1; min-width:0; padding:9px 10px; border:1px solid var(--border); border-radius:6px; color:var(--text); background:rgba(0,0,0,.22); }
    .reality-note { padding:12px 14px; border-left:2px solid var(--accent); background:rgba(139,165,201,.08); color:var(--muted); font-size:12px; line-height:1.5; }
    .terminal {
      height:100%; min-height:220px; padding:2px; background:#0c111a; color:#c5f6e7;
      font:13px/1.65 "Cascadia Code", Consolas, monospace;
    }
    .terminal-output { white-space:pre-wrap; overflow:auto; max-height:calc(100% - 28px); }
    .terminal-line { display:flex; gap:8px; }
    .prompt { color:#64ddc5; }
    .terminal input { flex:1; border:0; outline:0; background:transparent; color:#e8f3f2; font:inherit; }
    .editor { width:100%; height:100%; min-height:260px; resize:none; border:0; outline:0; background:transparent; color:#e8edf5; font:14px/1.65 "Cascadia Code",Consolas,monospace; }
    .settings { display:grid; gap:12px; }
    .setting-row { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:14px; border:1px solid var(--border); border-radius:9px; background:rgba(255,255,255,.035); }
    .setting-row small { display:block; color:var(--muted); margin-top:4px; }
    .switch { width:43px; height:24px; position:relative; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; border-radius:20px; background:#515b6a; cursor:pointer; transition:.2s; }
    .slider::before { content:""; position:absolute; height:18px; width:18px; top:3px; left:3px; background:white; border-radius:50%; transition:.2s; }
    .switch input:checked + .slider { background:#239b8d; }
    .switch input:checked + .slider::before { transform:translateX(19px); }
    .about-card { display:flex; gap:17px; align-items:center; padding:18px; border-radius:10px; background:linear-gradient(120deg,rgba(43,171,155,.2),rgba(75,115,184,.13)); }
    .about-logo { color:#b6c5d6; }
    .about-logo svg { width:42px; height:42px; display:block; }
    .about-card h2 { margin:0 0 5px; font-weight:500; }
    .about-card p, .muted { color:var(--muted); font-size:13px; line-height:1.5; }
    .status { color:var(--muted); font-size:12px; margin-top:14px; }
    .download-links { display:flex; flex-wrap:wrap; gap:9px; margin-top:14px; }
    .download-links a { display:inline-block; text-decoration:none; font-size:13px; }
    .start-menu {
      position:absolute; z-index:8; bottom:60px; left:10px; width:min(440px, calc(100vw - 20px));
      padding:16px; border:1px solid var(--border); border-radius:14px;
      background:rgba(17,24,37,.94); box-shadow:var(--shadow); backdrop-filter:blur(28px);
    }
    .start-menu.hidden { display:none; }
    .search {
      width:100%; padding:11px 14px; border:1px solid rgba(255,255,255,.14); border-radius:8px;
      outline:0; color:var(--text); background:rgba(0,0,0,.2);
    }
    .search:focus { border-color:var(--accent); }
    .menu-heading { margin:17px 5px 9px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.11em; }
    .app-list { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
    .app-launch {
      text-align:left; border:0; border-radius:7px; padding:10px; cursor:pointer; background:transparent;
      display:flex; align-items:center; gap:10px; font-size:13px;
    }
    .app-launch:hover { background:rgba(255,255,255,.09); }
    .app-launch svg { width:20px; height:20px; color:#c1cbd7; }
    .menu-footer { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); margin-top:15px; padding:13px 4px 0; color:var(--muted); font-size:12px; }
    .taskbar {
      position:absolute; z-index:7; bottom:0; inset-inline:0; height:52px;
      display:flex; align-items:center; justify-content:center; gap:7px;
      background:rgba(14,18,25,.90); border-top:1px solid rgba(255,255,255,.08); backdrop-filter:blur(25px);
    }
    .taskbar button { border:0; cursor:pointer; }
    .start-button, .task-app {
      height:40px; min-width:42px; border-radius:7px; background:transparent;
      display:flex; align-items:center; justify-content:center; font-size:22px;
    }
    .start-button:hover, .task-app:hover, .task-app.active { background:rgba(255,255,255,.1); }
    .start-button { color:#c3ccd6; }
    .start-button svg { width:19px; height:19px; }
    .task-app svg { width:20px; height:20px; color:#c5ced9; }
    .task-separator { height:25px; width:1px; background:var(--border); margin:0 3px; }
    .task-right { position:absolute; right:16px; display:flex; gap:13px; align-items:center; color:#c5cdd8; font-size:12px; }
    .notification {
      position:absolute; z-index:10; right:18px; bottom:68px; max-width:340px; padding:13px 16px;
      border:1px solid var(--border); border-radius:10px; background:var(--glass-solid); box-shadow:var(--shadow);
      font-size:13px; animation:pop .18s ease-out;
    }
    @keyframes pop { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
    .offline {
      position:absolute; z-index:2; top:54px; right:14px; border:1px solid rgba(255,255,255,.1);
      border-radius:4px; padding:6px 9px; background:rgba(12,16,22,.55); color:#bbc5d1; font-size:9px; letter-spacing:.035em;
    }
    body.light .desktop { filter:brightness(1.32) saturate(.82); }
    body.light { color-scheme:light; }
    @media (max-width:650px) {
      .topbar { padding:0 10px; } .top-left { gap:10px; } .top-item:nth-child(n+3) { display:none; }
      .desktop-icons { grid-template-rows:repeat(6,78px); left:8px; top:52px; }
      .desktop-icon { width:65px; } .welcome { bottom:72px; right:14px; }
      .window { left:5% !important; top:11% !important; width:90% !important; height:76% !important; min-width:0; }
      .task-right { right:9px; } .task-right .tray-item:first-child { display:none; }
    }
  </style>
</head>

  <main class="desktop" id="desktop">
    <header class="topbar">
      <div class="top-left">
        <div class="brand"><span class="brand-mark"><svg><use href="#i-nexus"></use></svg></span><span>NEXUS</span></div>
        <span class="top-item" data-app="files">Places</span>
        <span class="top-item" data-app="terminal">Terminal</span>
        <span class="top-item" data-app="about">System</span>
      </div>
      <div class="top-right">
        <span class="tray"><span class="tray-item" title="Network"><svg><use href="#i-network"></use></svg></span><span class="tray-item" title="Volume"><svg><use href="#i-volume"></use></svg></span><span class="tray-item" title="Power"><svg><use href="#i-power"></use></svg></span></span>
        <span id="clock"></span>
      </div>
    </header>

    <section class="desktop-icons" aria-label="Desktop shortcuts">
      <button class="desktop-icon" data-app="files"><svg class="glyph"><use href="#i-folder"></use></svg><span>Files</span></button>
      <button class="desktop-icon" data-app="terminal"><svg class="glyph"><use href="#i-terminal"></use></svg><span>Terminal</span></button>
      <button class="desktop-icon" data-app="software"><svg class="glyph"><use href="#i-package"></use></svg><span>Software</span></button>
      <button class="desktop-icon" data-app="editor"><svg class="glyph"><use href="#i-editor"></use></svg><span>Text Editor</span></button>
      <button class="desktop-icon" data-app="settings"><svg class="glyph"><use href="#i-settings"></use></svg><span>Settings</span></button>
      <button class="desktop-icon" data-app="stores"><svg class="glyph"><use href="#i-store"></use></svg><span>App Catalogs</span></button>
      <button class="desktop-icon" data-app="about"><svg class="glyph"><use href="#i-about"></use></svg><span>About NEXUS</span></button>
    </section>

    <div class="welcome">
      <h1>NEXUS OS</h1>
      <p>A focused workspace for building, exploring, and securing.</p>
    </div>
    <div class="offline">INTERACTIVE PREVIEW · RUNS LOCALLY · DOWNLOAD LINKS NEED INTERNET</div>

    <section class="window hidden" id="app-window" aria-label="Application window">
      <div class="titlebar" id="titlebar">
        <div class="window-title"><svg id="window-icon"><use href="#i-folder"></use></svg><span id="window-title">Files</span></div>
        <div class="window-controls">
          <button type="button" id="minimize" title="Minimize">—</button>
          <button type="button" id="maximize" title="Maximize">□</button>
          <button type="button" class="close" id="close" title="Close">×</button>
        </div>
      </div>
      <div class="window-content" id="window-content"></div>
    </section>

    <section class="start-menu hidden" id="start-menu">
      <input class="search" id="app-search" placeholder="Search apps and settings" autocomplete="off">
      <div class="menu-heading">Pinned applications</div>
      <div class="app-list" id="app-list"></div>
      <div class="menu-footer"><span><svg class="inline-icon"><use href="#i-nexus"></use></svg> &nbsp; NEXUS Live Session</span><span>● &nbsp; nexus</span></div>
    </section>

    <div class="taskbar">
      <button class="start-button" id="start-button" aria-label="Open applications"><svg><use href="#i-nexus"></use></svg></button>
      <span class="task-separator"></span>
      <button class="task-app" data-app="files" title="Files"><svg><use href="#i-folder"></use></svg></button>
      <button class="task-app" data-app="terminal" title="Terminal"><svg><use href="#i-terminal"></use></svg></button>
      <button class="task-app" data-app="browser" title="Web Browser"><svg><use href="#i-browser"></use></svg></button>
      <button class="task-app" data-app="software" title="Software Manager"><svg><use href="#i-package"></use></svg></button>
      <button class="task-app" data-app="editor" title="Text Editor"><svg><use href="#i-editor"></use></svg></button>
      <button class="task-app" data-app="settings" title="Settings"><svg><use href="#i-settings"></use></svg></button>
      <button class="task-app" data-app="stores" title="App Catalogs"><svg><use href="#i-store"></use></svg></button>
      <div class="task-right"><span class="tray-item" title="Network"><svg><use href="#i-network"></use></svg></span><span class="tray-item" title="Volume"><svg><use href="#i-volume"></use></svg></span><span class="tray-item" title="Battery"><svg><use href="#i-battery"></use></svg></span></div>
    </div>
    <div id="toast" class="notification" hidden></div>
  </main>
  <script>
    (() => {
      const apps = {
        files: { title: "File Manager", icon: "folder" },
        terminal: { title: "Terminal", icon: "terminal" },
        browser: { title: "Web Browser", icon: "browser" },
        software: { title: "Software Manager", icon: "package" },
        editor: { title: "Text Editor", icon: "editor" },
        settings: { title: "Settings", icon: "settings" },
        stores: { title: "App Catalogs", icon: "store" },
        about: { title: "About NEXUS OS", icon: "about" }
      };
      const win = document.getElementById("app-window");
      const content = document.getElementById("window-content");
      const menu = document.getElementById("start-menu");
      const appList = document.getElementById("app-list");
      const previewFiles = {
        "/home/nexus": [
          { name: "Documents", type: "folder" }, { name: "Downloads", type: "folder" },
          { name: "Pictures", type: "folder" }, { name: "Desktop", type: "folder" },
          { name: "network-monitor", type: "file" }, { name: "nexus-hardening", type: "file" },
          { name: "tor-routing", type: "file" }, { name: "Read Me.txt", type: "file" }
        ],
        "/home/nexus/Documents": [{ name: "Welcome.txt", type: "file" }],
        "/home/nexus/Downloads": [],
        "/home/nexus/Pictures": [],
        "/home/nexus/Desktop": [{ name: "NEXUS OS Preview", type: "file" }]
      };
      let fileHistory = ["/home/nexus"];
      let fileHistoryIndex = 0;
      let z = 4;
      let toastTimer;

      function icon(name, className = "") {
        return `<svg class="${className}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
      }

      function notify(text) {
        const toast = document.getElementById("toast");
        toast.textContent = text;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 2800);
      }

      function openApp(name) {
        const app = apps[name];
        if (!app) return;
        menu.classList.add("hidden");
        win.classList.remove("hidden");
        win.style.zIndex = ++z;
        document.getElementById("window-title").textContent = app.title;
        document.getElementById("window-icon").innerHTML = `<use href="#i-${app.icon}"></use>`;
        document.querySelectorAll(".task-app").forEach(button =>
          button.classList.toggle("active", button.dataset.app === name));
        content.innerHTML = appContent(name);
        if (name === "files") setupFiles();
        if (name === "terminal") setupTerminal();
        if (name === "software") setupSoftware();
        if (name === "settings") setupSettings();
        if (name === "editor") setupEditor();
      }

      function appContent(name) {
        if (name === "files") return `
          <div class="toolbar"><button class="toolbutton" id="back" title="Back">‹</button><button class="toolbutton" id="forward" title="Forward">›</button><div class="address">/home/nexus</div><button class="toolbutton" id="new-folder">＋ New folder</button></div>
          <div class="file-grid" id="file-grid"></div><div class="status" id="file-status"></div>`;
        if (name === "terminal") return `<div class="terminal"><div class="terminal-output" id="terminal-output">NEXUS Terminal · Preview shell (simulated)<br>Type <b>help</b> to see available demo commands.<br><br></div><label class="terminal-line"><span class="prompt">nexus@nexus:~$</span><input id="terminal-input" autocomplete="off" spellcheck="false" autofocus></label></div>`;
        if (name === "browser") return `<h2 style="font-size:18px;font-weight:500;margin:0 0 8px">Web Browser</h2><p class="store-intro">The real live image includes Epiphany. In this preview, open a destination in a new browser tab.</p><div class="store-grid">
          <article class="store-card"><div class="store-symbol">${icon("nexus")}</div><h3>NEXUS OS Releases</h3><p>Download the latest published live image and checksum parts.</p><a class="store-link" href="https://github.com/BloxdMini/The-Main-OS/releases/latest" target="_blank" rel="noopener noreferrer">Open latest release ↗</a></article>
          <article class="store-card"><div class="store-symbol">WEB</div><h3>App Catalogs</h3><p>Visit Google Play, Apple App Store, and Microsoft Store websites.</p><button class="toolbutton" type="button" data-launch-app="stores">Browse catalogs</button></article>
          <article class="store-card"><div class="store-symbol">OS</div><h3>Ubuntu Software</h3><p>Install Linux packages in the real OS with Synaptic or apt.</p><button class="toolbutton" type="button" data-launch-app="software">Open software guide</button></article>
          </div>`;
        if (name === "software") return `<h2 style="font-size:18px;font-weight:500;margin:0 0 8px">Ubuntu Software</h2><p class="store-intro">The real NEXUS live image includes Synaptic Package Manager and apt. The list below reflects selected image tools; the browser preview cannot inspect or install packages.</p><div class="package-list">
          <div class="package-row"><div><strong>Epiphany</strong><small>Web browser · epiphany-browser</small></div><span class="package-status">In live image</span></div>
          <div class="package-row"><div><strong>Synaptic</strong><small>Ubuntu package manager · synaptic</small></div><span class="package-status">In live image</span></div>
          <div class="package-row"><div><strong>Nmap</strong><small>Network discovery and auditing · nmap</small></div><span class="package-status">In live image</span></div>
          <div class="package-row"><div><strong>Wireshark</strong><small>Network protocol analyzer · wireshark</small></div><span class="package-status">In live image</span></div>
          </div><div class="reality-note">To install software, boot the actual NEXUS ISO and use Synaptic, or run apt in its terminal. Installations in a live session are temporary and disappear after reboot.</div><div class="install-command"><input id="package-name" aria-label="Ubuntu package name" value="nmap" maxlength="64" autocomplete="off"><button class="primary" id="copy-install-command" type="button">Copy apt command</button></div><p class="status" id="package-command-status">Copies a command only; nothing is installed by this preview.</p>`;
        if (name === "editor") return `<div class="toolbar"><button class="primary" id="save-note">Save note</button><span class="muted" id="save-status">Unsaved changes stay in this browser tab.</span></div><textarea class="editor" id="editor-text" spellcheck="false">Welcome to NEXUS OS\n\nThis is an interactive desktop preview. Your edits remain in this page only.\n\nFor the real Ubuntu live OS, launch the ISO in QEMU with Start-NEXUS-OS.bat.</textarea>`;
        if (name === "settings") return `<h2 style="font-size:18px;font-weight:500;margin:0 0 14px">Personalization & system</h2><div class="settings">
          <div class="setting-row"><div><strong>Light appearance</strong><small>Preview a brighter desktop palette</small></div><label class="switch"><input id="light-toggle" type="checkbox"><span class="slider"></span></label></div>
          <div class="setting-row"><div><strong>Sound</strong><small>Audio in this preview is not connected</small></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
          <div class="setting-row"><div><strong>Network</strong><small>Preview state: connected · system actions are simulated</small></div><span style="color:var(--accent)">● Online</span></div>
          <div class="setting-row"><div><strong>Live session</strong><small>Changes are temporary, like a live boot</small></div><span>Ubuntu 24.04 · AMD64</span></div>
          <button class="toolbutton" id="reset-settings">Restore default appearance</button></div>`;
        if (name === "stores") return `<h2 style="font-size:18px;font-weight:500;margin:0 0 8px">App stores</h2><p class="store-intro">Browse the official app catalogs below. These open in a new browser tab; they are external links, not an in-OS installer. Availability and installation depend on your device and account.</p><div class="store-grid">
          <article class="store-card"><div class="store-symbol" aria-hidden="true">GP</div><h3>Google Play</h3><p>Apps, games, books, and more for Android devices.</p><a class="store-link" href="https://play.google.com/store" target="_blank" rel="noopener noreferrer">Open Google Play ↗</a></article>
          <article class="store-card"><div class="store-symbol" aria-hidden="true">A</div><h3>Apple App Store</h3><p>Discover apps and games for iPhone, iPad, and other Apple devices.</p><a class="store-link" href="https://www.apple.com/app-store/" target="_blank" rel="noopener noreferrer">Open the App Store ↗</a></article>
          <article class="store-card"><div class="store-symbol" aria-hidden="true">MS</div><h3>Microsoft Store</h3><p>Explore apps, games, and entertainment for Windows.</p><a class="store-link" href="https://apps.microsoft.com/" target="_blank" rel="noopener noreferrer">Open Microsoft Store ↗</a></article>
          </div>`;
        return `<div class="about-card"><div class="about-logo">${icon("nexus")}</div><div><h2>NEXUS OS</h2><div>Ubuntu 24.04 · XFCE Live Desktop</div><p>A live environment for authorized security testing, software development, and learning.</p></div></div><h3 style="font-weight:500;margin:22px 0 7px">Get the real OS</h3><p class="muted">Download the Windows launcher and run it to fetch the latest tested ISO and start QEMU. No Git checkout is needed.</p><div class="download-links"><a class="primary" href="https://raw.githubusercontent.com/BloxdMini/The-Main-OS/main/Start-NEXUS-OS.bat" target="_blank" rel="noopener">Download Windows launcher</a><a class="toolbutton" href="https://github.com/BloxdMini/The-Main-OS/releases/latest" target="_blank" rel="noopener">Latest ISO release</a></div><h3 style="font-weight:500;margin:22px 0 7px">About this preview</h3><p class="muted">This standalone page demonstrates a desktop-like interface. It does not run Linux programs, access your files, or change your computer. For the real OS, download the ISO and run it in QEMU.</p><button class="primary" id="preview-info">What can this preview do?</button>`;
      }

      function setupTerminal() {
        const input = document.getElementById("terminal-input");
        const output = document.getElementById("terminal-output");
        input.focus();
        input.addEventListener("keydown", event => {
          if (event.key !== "Enter") return;
          const command = input.value.trim();
          const safe = command.replace(/[&<>"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
          let result = "";
          if (command === "help") result = "help · neofetch · ls · pwd · date · whoami · ip addr · network-monitor · tor-check · clear";
          else if (command === "neofetch") result = "       ◈  NEXUS OS\n    Ubuntu 24.04 · XFCE\n    Kernel: Linux (preview)\n    Shell: simulated demo shell\n    Session: Live · AMD64";
          else if (command === "ls") result = "Desktop  Documents  Downloads  Pictures  network-monitor  nexus-hardening  tor-routing";
          else if (command === "pwd") result = "/home/nexus";
          else if (command === "whoami") result = "nexus";
          else if (command === "date") result = new Date().toString();
          else if (command === "ip addr") result = "lo: <LOOPBACK,UP> 127.0.0.1/8\nenp0s3: <BROADCAST,MULTICAST,UP> 192.168.122.20/24 (simulated)";
          else if (command === "network-monitor") result = "[preview] Network monitor launched. No host or network scanning is performed.";
          else if (command === "tor-check") result = "[preview] Tor is not connected in this browser simulation. Run tor-routing inside the live OS.";
          else if (command === "clear") { output.textContent = ""; input.value = ""; return; }
          else if (command) result = `Command not available in preview: ${safe}\nTry "help".`;
          output.textContent += `nexus@nexus:~$ ${safe}\n${result}\n\n`;
          input.value = "";
          output.scrollTop = output.scrollHeight;
        });
      }

      function setupFiles() {
        const address = content.querySelector(".address");
        const grid = document.getElementById("file-grid");
        const status = document.getElementById("file-status");

        function renderFiles() {
          const path = fileHistory[fileHistoryIndex];
          address.textContent = path;
          grid.replaceChildren();
          const entries = previewFiles[path] || [];
          entries.forEach(entry => {
            const button = document.createElement("button");
            button.className = "file";
            const fileIcon = document.createElement("span");
            fileIcon.innerHTML = icon(entry.type === "folder" ? "folder" : "file");
            const label = document.createElement("span");
            label.textContent = entry.name;
            button.append(fileIcon, label);
            button.addEventListener("click", () => {
              if (entry.type === "folder") {
                const nextPath = `${path}/${entry.name}`;
                if (!previewFiles[nextPath]) previewFiles[nextPath] = [];
                fileHistory = fileHistory.slice(0, fileHistoryIndex + 1);
                fileHistory.push(nextPath);
                fileHistoryIndex++;
                renderFiles();
              } else {
                notify(`${entry.name}: preview file. Nothing on your computer is opened.`);
              }
            });
            grid.append(button);
          });
          status.textContent = `${entries.length} item${entries.length === 1 ? "" : "s"} · Virtual preview filesystem`;
          document.getElementById("back").disabled = fileHistoryIndex === 0;
          document.getElementById("forward").disabled = fileHistoryIndex >= fileHistory.length - 1;
        }

        document.getElementById("back").addEventListener("click", () => {
          if (fileHistoryIndex > 0) { fileHistoryIndex--; renderFiles(); }
        });
        document.getElementById("forward").addEventListener("click", () => {
          if (fileHistoryIndex < fileHistory.length - 1) { fileHistoryIndex++; renderFiles(); }
        });
        document.getElementById("new-folder").addEventListener("click", () => {
          const name = window.prompt("Name this preview folder:");
          if (name === null) return;
          const cleanName = name.trim();
          if (!cleanName || /[\/\\]/.test(cleanName)) {
            notify("Enter a folder name without path separators.");
            return;
          }
          const path = fileHistory[fileHistoryIndex];
          const entries = previewFiles[path];
          if (entries.some(entry => entry.name.toLowerCase() === cleanName.toLowerCase())) {
            notify("An item with that name already exists.");
            return;
          }
          entries.push({ name: cleanName, type: "folder" });
          previewFiles[`${path}/${cleanName}`] = [];
          renderFiles();
          notify(`Created ${cleanName} in the virtual preview.`);
        });
        renderFiles();
      }

      function setupSettings() {
        document.getElementById("light-toggle").addEventListener("change", event =>
          document.body.classList.toggle("light", event.target.checked));
        document.getElementById("reset-settings").addEventListener("click", () => {
          document.body.classList.remove("light");
          document.getElementById("light-toggle").checked = false;
          notify("Default appearance restored.");
        });
      }

      function setupSoftware() {
        const input = document.getElementById("package-name");
        document.getElementById("copy-install-command").addEventListener("click", async () => {
          const packageName = input.value.trim();
          if (!/^[A-Za-z0-9][A-Za-z0-9+.-]{0,63}$/.test(packageName)) {
            notify("Enter a valid Ubuntu package name.");
            input.focus();
            return;
          }
          const command = `sudo apt install ${packageName}`;
          let copied = false;
          if (navigator.clipboard && window.isSecureContext) {
            try {
              await navigator.clipboard.writeText(command);
              copied = true;
            } catch {}
          }
          if (!copied) {
            const temporaryInput = document.createElement("textarea");
            temporaryInput.value = command;
            temporaryInput.setAttribute("readonly", "");
            temporaryInput.style.position = "fixed";
            temporaryInput.style.opacity = "0";
            document.body.append(temporaryInput);
            temporaryInput.select();
            try { copied = document.execCommand("copy"); }
            catch { copied = false; }
            finally { temporaryInput.remove(); }
          }
          const status = document.getElementById("package-command-status");
          status.textContent = copied
            ? `Copied: ${command} · paste it in the real live OS terminal to install.`
            : `Copy was blocked by this browser. In the real OS terminal, run: ${command}`;
          notify(copied ? "Install command copied; preview did not install anything." : "Copy blocked. The command is shown below.");
        });
      }

      function setupEditor() {
        const editor = document.getElementById("editor-text");
        editor.addEventListener("input", () => {
          document.getElementById("save-status").textContent = "Unsaved changes";
        });
        document.getElementById("save-note").addEventListener("click", () => {
          try {
            localStorage.setItem("nexus-preview-note", editor.value);
            document.getElementById("save-status").textContent = "Saved in this browser";
            notify("Note saved locally in this browser.");
          } catch {
            notify("Browser storage is unavailable; the note remains in this page.");
          }
        });
        try {
          const saved = localStorage.getItem("nexus-preview-note");
          if (saved !== null) editor.value = saved;
        } catch { /* Keep the built-in sample text when storage is unavailable. */ }
      }

      function buildMenu(filter = "") {
        appList.innerHTML = "";
        Object.entries(apps).filter(([key, app]) =>
          `${key} ${app.title}`.toLowerCase().includes(filter.toLowerCase())).forEach(([key, app]) => {
            const button = document.createElement("button");
            button.className = "app-launch";
            button.innerHTML = `${icon(app.icon)}<span>${app.title}</span>`;
            button.addEventListener("click", () => openApp(key));
            appList.append(button);
          });
      }

      document.querySelectorAll("[data-app]").forEach(button =>
        button.addEventListener("click", () => openApp(button.dataset.app)));
      document.getElementById("start-button").addEventListener("click", () => {
        menu.classList.toggle("hidden");
        if (!menu.classList.contains("hidden")) document.getElementById("app-search").focus();
      });
      document.getElementById("app-search").addEventListener("input", event => buildMenu(event.target.value));
      document.getElementById("close").addEventListener("click", () => win.classList.add("hidden"));
      document.getElementById("minimize").addEventListener("click", () => win.classList.add("hidden"));
      document.getElementById("maximize").addEventListener("click", () => win.classList.toggle("maximized"));
      win.addEventListener("pointerdown", () => { win.style.zIndex = ++z; });
      content.addEventListener("click", event => {
        const launchButton = event.target.closest("[data-launch-app]");
        if (launchButton) { openApp(launchButton.dataset.launchApp); return; }
        if (event.target.id === "preview-info") notify("Try the Start menu, Files, Text Editor, Settings, and demo terminal.");
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") { menu.classList.add("hidden"); win.classList.add("hidden"); }
        if ((event.ctrlKey || event.metaKey) && event.code === "Space") {
          event.preventDefault(); menu.classList.toggle("hidden");
        }
      });

      const titlebar = document.getElementById("titlebar");
      titlebar.addEventListener("pointerdown", event => {
        if (event.target.closest("button") || win.classList.contains("maximized")) return;
        const rect = win.getBoundingClientRect();
        const dx = event.clientX - rect.left, dy = event.clientY - rect.top;
        titlebar.setPointerCapture(event.pointerId);
        const move = moveEvent => {
          win.style.left = `${Math.max(0, moveEvent.clientX - dx)}px`;
          win.style.top = `${Math.max(40, moveEvent.clientY - dy)}px`;
        };
        const done = () => {
          titlebar.removeEventListener("pointermove", move);
          titlebar.removeEventListener("pointerup", done);
          titlebar.removeEventListener("pointercancel", done);
        };
        titlebar.addEventListener("pointermove", move);
        titlebar.addEventListener("pointerup", done);
        titlebar.addEventListener("pointercancel", done);
      });

      function updateClock() {
        document.getElementById("clock").textContent = new Intl.DateTimeFormat(undefined, {
          weekday:"short", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"
        }).format(new Date());
      }
      buildMenu();
      updateClock();
      setInterval(updateClock, 15000);
    })();
  </script>
</body>
</html>
