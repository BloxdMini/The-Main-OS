name: Build NEXUS OS ISO

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-iso.yml"
      - "custom-os-build/**"
  repository_dispatch:
    types: [build-iso]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Validate build scripts
        run: bash -n custom-os-build/scripts/*.sh

      - name: Build ISO builder image
        run: docker build -t nexus-os-builder ./custom-os-build

      - name: Build live ISO
        run: |
          mkdir -p output
          docker run --rm --privileged -v "$PWD/output:/output" nexus-os-builder

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Boot ISO to graphical login
        run: |
          set -euo pipefail
          qemu-system-x86_64 \
            -machine accel=tcg \
            -m 4096 \
            -smp 2 \
            -cdrom output/nexus-os.iso \
            -boot d \
            -display vnc=127.0.0.1:0 \
            -serial file:qemu.log \
            -monitor none \
            -no-reboot \
            -no-shutdown > qemu-launch.log 2>&1 &
          qemu_pid=$!
          cleanup() {
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 360))
          boot_ready=false
          while (( SECONDS < deadline )); do
            sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' qemu.log > qemu-clean.log 2>/dev/null || true
            if grep -E -q "Started .*Light Display Manager" qemu-clean.log \
              && grep -E -q "Reached target .*Graphical Interface" qemu-clean.log \
              && grep -q "NEXUS_DESKTOP_SESSION=running" qemu-clean.log; then
              boot_ready=true
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$boot_ready" != true ]]; then
            tail -n 160 qemu.log 2>/dev/null || true
            cat qemu-launch.log
            echo "ISO did not reach a running XFCE session within 360 seconds." >&2
            exit 1
          fi
          echo "ISO reached LightDM, graphical.target, and a running XFCE session in QEMU."

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-os-iso
          path: output/nexus-os.iso
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Split ISO for release download
        if: github.ref == 'refs/heads/main'
        run: |
          split -b 1800M --numeric-suffixes=0 --suffix-length=2 \
            output/nexus-os.iso output/nexus-os.iso.part-
          part_count=$(find output -maxdepth 1 -type f -name 'nexus-os.iso.part-*' | wc -l)
          sha256sum output/nexus-os.iso | awk -v count="$part_count" '{ print count "\n" $1 }' \
            > output/nexus-os.iso.parts

      - name: Publish latest downloadable ISO
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "NEXUS OS - Latest" \
              --notes "Rolling download of the latest tested NEXUS OS live ISO." \
              --latest
          gh release edit latest --latest
          while IFS= read -r asset; do
            gh release delete-asset latest "$asset" --yes
          done < <(gh release view latest --json assets \
            --jq '.assets[].name | select(startswith("nexus-os.iso.part-") or . == "nexus-os.iso.parts")')
          gh release upload latest output/nexus-os.iso.parts output/nexus-os.iso.part-* --clobber
